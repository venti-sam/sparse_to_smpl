data:
  dataset_dir: ../support_data/vr_teleop_dataset_v2  # from src/convert_dataset_v2.py
  window_size: 40
  train_split: 0.9 # Fallback if folders not used
  train_folders: ["CMU", "KIT", "BMLrub", "BMLmovi", "PosePrior"]
  val_folders: ["SFU", "HDM05"]
  test_folders: ["SSM"]
  augmentation:
    enabled: true
    pos_jitter_std: 0.0015  # per-frame sensor jitter (m)
    rot_jitter_deg: 0.5     # per-frame sensor jitter
    pos_bias_std: 0.0       # off: the tracker mount below replaces the old fixed bias
    rot_bias_deg: 0.0
    vel_noise_std: 0.01     # noise on velocity features
    dropout_prob: 0.1       # per-window probability of one tracker freezing
    dropout_frames: [5, 30] # freeze duration range (frames at 60 Hz)
    bone_scale_global: 0.15   # body size x U(0.85, 1.15), inputs and targets
    bone_scale_limb_std: 0.05 # per-bone lognormal jitter (left/right shared)
    # Vive mounting. Each tracker is rigid on a body joint; offsets are in that
    # joint's local frame (x forward, y left, z up), metres / degrees.
    # Train: sampled per window around the mean. Val/test: the mean, no noise.
    # Means come from the live launch file (pelvis_offset, ankle_offset,
    # ankle_drop); rot_std_deg is [roll(x), pitch(y), yaw(z)].
    mount:
      pelvis:  # belt, tracker at the buckle in front of the pelvis
        pos_mean: [0.10, 0.0, 0.0]
        pos_std: [0.015, 0.01, 0.015]
        rot_std_deg: [3.0, 3.0, 3.0]
      ankle:   # strap on the shin just above the ankle (follows the shin/knee frame)
        pos_mean: [0.03, 0.0, 0.12]
        pos_std: [0.015, 0.01, 0.02]
        rot_std_deg: [6.0, 15.0, 8.0]
      head:    # HMD at the eyes, relative to the SMPL head joint
        pos_mean: [0.09, 0.0, 0.07]
        pos_std: [0.01, 0.01, 0.01]
        rot_std_deg: [3.0, 3.0, 3.0]
      hand:    # controller held like a stick, past the wrist along the forearm
        along_forearm: 0.08
        pos_std: [0.015, 0.015, 0.015]
        rot_std_deg: [25.0, 25.0, 25.0]
  batch_size: 256
  num_workers: 4
  fps: 60.0

model:
  input_dim: 108  # 6 trackers × (pos3 + 6d6 + vel_pos3 + vel_6d6)
  embed_dim: 512
  num_layers: 6
  num_heads: 8

training:
  lr: 1.0e-4
  epochs: 200
  scheduler_milestones: [15, 30, 45, 60, 90, 120]
  scheduler_gamma: 0.5
  grad_clip: 0.5
  lambda_pos: 5.0
  lambda_rot: 0.5
  lambda_vel: 0.1
  save_dir: ../checkpoints_v2
  log_interval: 50
  val_interval: 1

wandb:
  project: vr-body-pose
  entity: null
